      exclude_days: [5, 6]
  stripmall_reward_smud:
    class: TimeVaryingCostLinearReward
    kwargs:
      temperature_variables: [Z1_temperature, Z2_temperature, Z3_temperature, Z4_temperature, Z5_temperature, Z6_temperature, Z7_temperature, Z8_temperature, Z9_temperature, Z10_temperature]
      energy_variables: [ChillerElectricity]
      # Cooling setpoint = 24°C (epJSON CLGSETP_SCH); range contains setpoint mid.
      range_comfort_winter: [22.0, 26.0]
      range_comfort_summer: [22.0, 26.0]
      summer_start: [6, 1]
      summer_final: [9, 30]
      energy_weight: 0.5
      lambda_energy: 1.0
      # Cost-only, as the four original buildings. Occupied 07-21 h local
      # (weekday occupancy > 0 in the model); the model runs on daylight-saving
      # time while the hour label is standard time, so [6, 20] in the label.
      lambda_temperature: 0.0
      price_schedule: *smud
      occupied_hours: [6, 20]
      exclude_days: [5, 6]


  restaurant_reward_smud:
    class: TimeVaryingCostLinearReward
    kwargs:
      temperature_variables: [Dining_temperature, Kitchen_temperature]
      energy_variables: [ChillerElectricity]
      range_comfort_winter: [22.0, 26.0]
      range_comfort_summer: [22.0, 26.0]
      summer_start: [6, 1]
      summer_final: [9, 30]
      energy_weight: 0.5
      lambda_energy: 1.0
      # Cost-only, as the four original buildings.
      lambda_temperature: 0.0
      price_schedule: *smud
      # Occupied 11-22 h local (original schedule). The model runs its
      # schedules on daylight-saving time while the hour label is standard
      # time, so the window is 10-21 in the label.
      occupied_hours: [10, 21]
      exclude_days: [5, 6]

  # DOE 90.1-2019 stand-alone retail (RT). Occupied cooling setpoint 23.89 C ->
  # [22, 26] (as WH 23.9 C). Occupied = weekday setpoint window with occupancy > 0
  # = 07-21 h local; daylight-saving model, so [6, 20] in the standard-time label.
  retail_reward_smud:
    class: TimeVaryingCostLinearReward
    kwargs:
      temperature_variables: [Z1_temperature, Z2_temperature, Z3_temperature, Z4_temperature]
      energy_variables: [ChillerElectricity]
      range_comfort_winter: [22.0, 26.0]
      range_comfort_summer: [22.0, 26.0]
      summer_start: [6, 1]
      summer_final: [9, 30]
      energy_weight: 0.5
      lambda_energy: 1.0
      lambda_temperature: 0.0
      price_schedule: *smud
      occupied_hours: [6, 20]
      exclude_days: [5, 6]

  # DOE 90.1-2019 quick-service (fast-food) restaurant (QS). Band =
  # occupied cooling setpoint +- 2 C per zone: Dining (Z1) 23.89 C -> [22, 26] (as retail and
  # WH 23.9 C), Kitchen (Z2) 26.11 C -> [24.11, 28.11]. Occupied = weekday setpoint window
  # with occupancy > 0 = 05-24 h local; DST model, so [4, 23] in the label.
  fastfood_reward_smud:
    class: TimeVaryingCostLinearReward
    kwargs:
      temperature_variables: [Z1_temperature, Z2_temperature]
      energy_variables: [ChillerElectricity]
      range_comfort_winter: [22.0, 26.0]
      range_comfort_summer: [22.0, 26.0]
      zone_comfort_ranges:
        Z1_temperature: [22.0, 26.0]
        Z2_temperature: [24.11, 28.11]
      summer_start: [6, 1]
      summer_final: [9, 30]
      energy_weight: 0.5
      lambda_energy: 1.0
      lambda_temperature: 0.0
      price_schedule: *smud
      occupied_hours: [4, 23]
      exclude_days: [5, 6]

