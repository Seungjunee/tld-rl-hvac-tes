    csv_logger: true
    reduce_observation: *proposed_27dim
    physical_normalize_observation: true
    physical_normalize_reward: true
    normalize_action: false

  warehouse_sac_continuous_no_forecast:
    order:
      - day_of_week
      - datetime
      - chiller_status
      - comfort_violation
      - weather_forecast
      - price_forecast
      - logger
      - csv_logger
      - reduce_observation
      - physical_normalize_observation
      - physical_normalize_reward
    datetime: true
    day_of_week: true
    chiller_status: true
    comfort_violation:
      temperature_variables: [Office_temperature]
      occupied_hours: [7, 18]
      t_min: 22.0
      t_max: 26.0
      exclude_days: [5, 6]
    weather_forecast:
      horizon: 12
      columns:
        - Dry Bulb Temperature
        - Relative Humidity
    price_forecast:
      horizon: 12
    logger: true
    csv_logger: true
    reduce_observation:
      keep:
        - CWtank_final
        - CWtank_node1
        - CWtank_node2
        - CWtank_node3
        - CWtank_node4
        - CWtank_node5
        - CWtank_node6
        - CWtank_use_outlet
        - chiller_status
        - comfort_violation
        - current_price
        - CoolingRate
        - price_forecast_1
        - price_forecast_2
        - price_forecast_3
        - price_forecast_4
        - price_forecast_5
        - price_forecast_6
        - price_forecast_7
        - price_forecast_8
        - price_forecast_9
        - price_forecast_10
        - price_forecast_11
        - price_forecast_12
    physical_normalize_observation: true
    physical_normalize_reward: true
    normalize_action: false

training_profiles:
  # PPO replication: SB3 PPO defaults except
  # gamma 0.995 and 2x256 ReLU pi/vf (SAC-sized networks). The cases add the
  # normalize_action wrapper so PPO acts in [-1, 1] (SAC rescales internally).
  # Ten seasons, deterministic evaluation after every season.
  episodes_10_ppo_cont:
    episodes: 10
    algorithm: ppo
    evaluation:
      enabled: true
      n_eval_episodes: 1
      eval_freq_episodes: 1
      deterministic: true
    model_kwargs:
      learning_rate: 0.0003
      n_steps: 2048
      batch_size: 64
      n_epochs: 10
      gamma: 0.995
      gae_lambda: 0.95
      clip_range: 0.2
      ent_coef: 0.0
      vf_coef: 0.5
      max_grad_norm: 0.5
    policy_kwargs:
      net_arch:
        pi: [256, 256]
        vf: [256, 256]
      activation_fn: ReLU
      log_std_init: 0.0
  episodes_1_dataset:
    episodes: 1
    evaluation:
      enabled: false

  episodes_15_with_eval:
    episodes: 30
    evaluation:
      enabled: false


  episodes_50_with_eval:
    episodes: 2   # 2026-06-25: RBC is deterministic, 1-2 episodes suffice (was 30, redundant compute)
    evaluation:
      enabled: false

  episodes_15_continue:
    # Bumped 20 → 30 for transfer parity with pretrain.
    episodes: 30
    reset_num_timesteps: false
    learn_kwargs:
      reset_num_timesteps: false
    evaluation:
      enabled: false

  episodes_15_training:
    # Bumped 20 → 30 for transfer/scratch parity with pretrain.
    episodes: 30
    evaluation:
      enabled: false

  timesteps_32000_continue:
    total_timesteps: 32000
    reset_num_timesteps: false
    learn_kwargs:
      reset_num_timesteps: false

  timesteps_50000_continue:
    total_timesteps: 50000
    reset_num_timesteps: false
    learn_kwargs:
      reset_num_timesteps: false

  timesteps_32000_training:
    total_timesteps: 32000

  timesteps_50000_training:
    total_timesteps: 50000

  episodes_10_sac:
    episodes: 10
    algorithm: sac
    evaluation:
      enabled: true
      n_eval_episodes: 1
      eval_freq_episodes: 1   # 2026-06-25: per-episode deterministic eval+best_model checkpoint (5-building pipeline)
      deterministic: true
    model_kwargs:
      learning_rate: 3.0e-4
      batch_size: 256
      buffer_size: 100000
      learning_starts: 1000
      tau: 0.005
      gamma: 0.995
      train_freq: 1
      gradient_steps: 1
      ent_coef: auto

  episodes_5_sac:
    episodes: 5
    algorithm: sac
    evaluation:
      enabled: true
      n_eval_episodes: 1
      eval_freq_episodes: 1   # 2026-06-25: per-episode deterministic eval+best_model checkpoint (5-building pipeline)
      deterministic: true
    model_kwargs:
      learning_rate: 3.0e-4
      batch_size: 256
      buffer_size: 100000
      learning_starts: 1000
      tau: 0.005
      gamma: 0.995
      train_freq: 1
      gradient_steps: 1
      ent_coef: auto

  episodes_1_eval_sac:
    episodes: 1
    algorithm: sac
    evaluation:
      enabled: true
      n_eval_episodes: 1
      eval_freq_episodes: 1   # 2026-06-25: per-episode deterministic eval+best_model checkpoint (5-building pipeline)
      deterministic: true
    model_kwargs:
      learning_rate: 3.0e-4
      batch_size: 256
      buffer_size: 100000
      learning_starts: 1000
      tau: 0.005
      gamma: 0.995
      train_freq: 1
      gradient_steps: 1
      ent_coef: auto

  # PPO + Discrete(2) variant — same step budget as episodes_10_sac (10 ep
  # = 117K step) for fair vs SAC continuous comparison. PPO categorical
  # policy handles bang-bang TES TOU naturally; SB3 defaults except gamma
  # matched to SAC profile. ent_coef=0.01 kept for exploration without
  # collapsing to single action.
  episodes_10_ppo_d2:
    episodes: 10
    algorithm: ppo
    evaluation:
      enabled: true
      n_eval_episodes: 1
      eval_freq_episodes: 2
      deterministic: true
    model_kwargs:
      learning_rate: 3.0e-4
      n_steps: 2048
      batch_size: 64
      n_epochs: 10
      gamma: 0.995
      gae_lambda: 0.95
      clip_range: 0.2
      ent_coef: 0.01
      vf_coef: 0.5
      max_grad_norm: 0.5

export_profiles:
  dataset_flat_export:
    profile: flat_export
    overwrite: true
    preprocess:
      observations: observations.csv
      infos: infos.csv
      out: observations_processed.csv
      n_steps: 96

  model_flat_export:
    profile: flat_export
    overwrite: true

  transfer_workspace_export:
    profile: workspace_export
    overwrite: true
    snapshot_selectors: [first, penultimate, last]

cleanup_policies:
  retain_recent_three:
    # 2026-06-27: retain_success 3->8 for the 5-seed pipeline. extract_paper_tables.py
    # reads each seed's EVAL workspace (workspaces/<case>/*/*_EVAL_*-res1/progress.csv);
    # with retain<5 the built-in per-seed cleanup rmtree'd the 2 oldest seed workspaces,
    # breaking seeded_stats(). 8 covers 5 seeds + retries. The batch launcher owns disk
    # (strips heavy EnergyPlus output per case, keeps progress.csv). Backup:
    # scratchpad/recipes_pre_retain_edit.yaml
    retain_success: 8
    retain_failure: 3

figure_styles:
  paper_default:
    figsize: [10, 6]
    grid_alpha: 0.3
