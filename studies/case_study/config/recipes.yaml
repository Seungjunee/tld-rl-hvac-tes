# --- OEB Ontario summer TOU price schedules (¢/kWh) ---
# Schedule: 0-6 off, 7-10 mid, 11-16 on, 17-18 mid, 19-23 off
# Toggle reward profiles below by changing `*oeb_2x` ↔ `*oeb_1x`
_oeb_schedules:
  oeb_1x: &oeb_1x
    [0.098, 0.098, 0.098, 0.098, 0.098, 0.098, 0.098, 0.157, 0.157, 0.157, 0.157, 0.203, 0.203, 0.203, 0.203, 0.203, 0.203, 0.157, 0.157, 0.098, 0.098, 0.098, 0.098, 0.098]
  # peak ratio 2.07× off (native OEB pricing)
  oeb_2x: &oeb_2x
    [0.098, 0.098, 0.098, 0.098, 0.098, 0.098, 0.098, 0.157, 0.157, 0.157, 0.157, 0.406, 0.406, 0.406, 0.406, 0.406, 0.406, 0.157, 0.157, 0.098, 0.098, 0.098, 0.098, 0.098]
  # peak ratio 4.14× off (2× peak amplification)
  # --- SMUD TOD-5-8pm tariff (Sacramento Municipal Utility District summer rate) ---
  # Off-peak  midnight–noon ($0.155/kWh)  [12 hours]
  # Mid-peak  noon–5pm + 8pm–midnight ($0.2139/kWh)  [9 hours]
  # On-peak   5pm–8pm ($0.3765/kWh)  [3 hours, peak ratio 2.43× off]
  smud: &smud
    [0.155, 0.155, 0.155, 0.155, 0.155, 0.155, 0.155, 0.155, 0.155, 0.155, 0.155, 0.155,
     0.2139, 0.2139, 0.2139, 0.2139, 0.2139, 0.3765, 0.3765, 0.3765, 0.2139, 0.2139, 0.2139, 0.2139]

  # Sharp TOU variant (2026-06-01) — 8× peak/off spread for env ablation.
  # SMUD canonical is 2.43× (0.155 / 0.3765), too narrow for dynamic policy
  # to outperform best static (RBC1 = best static for Office/WH already).
  # Schedule shape same (peak at 17-19), only amplitudes scaled.
  smud_sharp: &smud_sharp
    [0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10,
     0.20, 0.20, 0.20, 0.20, 0.20, 0.80, 0.80, 0.80, 0.20, 0.20, 0.20, 0.20]

