buildings:
  restaurant_3zone:
    env_id: Eplus-FullServiceRestaurant-mixed-continuous-v1
    env_name_base: restaurant_3zone
    register_yaml: sinergym/data/default_configuration/FullServiceRestaurant.yaml
    workspace_tag: restaurant_3zone
    reward_profile: restaurant_reward
    runtime:
      max_episode_store: 80
    physical:
      # Sized by the extension rules: season-peak CoolingRate under RBC on a
      # 2x-plant sizing run 155.6 kW -> q_rated = 155.6 / 0.9 = 173 kW; tank
      # 104.3 m3 (3.5 h of q_rated).
      q_rated: 173000.0
      cop_rated: 3.2
      tes_setpoint_range:
      - 5.0
      - 10.0
    observation_profiles:
      raw_export: restaurant_observation_export
      transfer_feature: restaurant_scratch_baseline_d3
