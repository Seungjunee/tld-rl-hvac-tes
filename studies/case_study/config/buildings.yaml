  # Re-activated 2026-05-14 for SAC SMUD expansion. Cooling SP 24°C weekday /
  # 33°C weekend; range_comfort [22, 26].
  # 2026-06-24 RESOLVED: the old "250 kW gives +8.8% transfer" story was an ARTIFACT,
  # not a real TES benefit. A direct leverage test (rbc vs const-10 "never charge")
  # showed RBC > const10 at BOTH 156 kW (34.84 > 34.11) AND 250 kW (40.93 > 37.97):
  # charging the TES COSTS money for stripmall at every chiller size. The oversized
  # 250 kW chiller simply made the RBC over-charge harder (40.93, a worse baseline),
  # so a "don't charge" policy scored +7.2% against it — the SAC's +8.8% was that, not
  # smart shifting. Cause is NOT load timing (on-peak load 18.5%, > office's 15.1%) nor
  # tank size (tank stores 3.6x the daily on-peak load); it is the plant's TES round-trip
  # inefficiency (5°C cold-water charging COP penalty + standing loss) exceeding the TOU
  # benefit. stripmall is therefore a genuine TES-RESISTANT building (kept as an honest
  # contrast case 2026-06-24). q_rated is set to 156 kW purely for PLR_max~0.94
  # normalization parity; it is NOT a transfer-strength knob.
  stripmall_10zone:
    env_id: Eplus-StripMall-mixed-continuous-v1
    env_name_base: stripmall_10zone
    register_yaml: sinergym/data/default_configuration/StripMall.yaml
    workspace_tag: stripmall_10zone
    reward_profile: stripmall_reward
    runtime:
      max_episode_store: 80
    physical:
      # Sized by the extension rules: season-peak CoolingRate under RBC on a
      # 2x-plant sizing run 202.5 kW (weekend HVAC off) -> q_rated = 202.5 / 0.9
      # = 225 kW; tank 135.6 m3 (3.5 h of q_rated).
      q_rated: 225000.0
      cop_rated: 3.2
      tes_setpoint_range:
      - 5.0
      - 10.0
    observation_profiles:
      raw_export: stripmall_observation_export
      transfer_feature: stripmall_scratch_baseline_d3
  warehouse_3zone:
    env_id: Eplus-Warehouse-mixed-continuous-v1
    env_name_base: warehouse_3zone
    register_yaml: sinergym/data/default_configuration/Warehouse.yaml
    workspace_tag: warehouse_3zone
    reward_profile: warehouse_reward
    runtime:
      max_episode_store: 80
    physical:
      # Re-calibrated 2026-05-30: actual operating max Q_load = 56.85 kW = 99.95%
      # of previous q_rated (saturation at norm=1.0 boundary). New q_rated 65 kW
      # = 56.85 + 14% margin for stable PhysicalNormalize.
      q_rated: 57000.0
      cop_rated: 3.2
      tes_setpoint_range:
      - 5.0
      - 10.0
    observation_profiles:
      raw_export: warehouse_observation_export
      transfer_feature: warehouse_scratch_baseline_d3

