# Case study configuration (TLD-RL paper).
# Four-building matrix (OF/LB/WH/MO): RBC, E2E (sac_e2e), Padding (sacp_e2e source +
# padrl fine-tuning / padff frozen-feature fine-tuning), TLD-RL (sac_plus + zs).
# Further commercial buildings (RE/SM/RT/QS): zero-shot targets of the four sources.
# PPO replication (__r1ppo) and comfort-weighted reward (__r1cw<k>) arms.
cases:
- id: build_office_observation_dataset
  stage: dataset
  building: office_5zone
  method: scratch_baseline
  training_profile: episodes_1_dataset
  observation_profile: office_observation_export
  export_profile: dataset_flat_export
  outputs:
    model_name: model
- id: build_lbuilding_observation_dataset
  stage: dataset
  building: office_lbuilding_8zone
  method: scratch_baseline
  training_profile: episodes_1_dataset
  observation_profile: lbuilding_observation_export
  export_profile: dataset_flat_export
  outputs:
    model_name: model
- id: build_warehouse_observation_dataset
  stage: dataset
  building: warehouse_3zone
  method: scratch_baseline
  training_profile: episodes_1_dataset
  observation_profile: warehouse_observation_export
  export_profile: dataset_flat_export
  outputs:
    model_name: model
# RBC-logged predictor dataset (2026-07-13): same export profile as the SAC-explore
# dataset above, but the season is operated by the paper's incumbent rbc_tou
# controller. Used to check log-controller invariance of the load predictor
# (paper claim: predictor fits on passively logged operation).
- id: build_office_observation_dataset_rbc
  stage: dataset
  building: office_5zone
  method: rbc_tou
  reward_profile: office_reward_smud
  training_profile: episodes_1_dataset
