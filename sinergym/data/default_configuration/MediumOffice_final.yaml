# Documentation: https://ugr-sail.github.io/sinergym/compilation/main/pages/environments_registration.html
# ---------------------------------------------------------------------------- #
#                        ID BASE FROM ENVIRONMNET NAMES                        #
# ---------------------------------------------------------------------------- #
id_base: MediumOfficeFinal

# ---------------------------------------------------------------------------- #
#                         BUILDING AND WEATHER SETTINGS                        #
# ---------------------------------------------------------------------------- #
building_file: MediumOffice_final.epJSON

# A environment alternative for each weather key
weather_specification:
  weather_files:
    - USA_AZ_Davis-Monthan.AFB.722745_TMY3.epw
    - USA_IL_Chicago-OHare.Intl.AP.725300_TMY3.epw
    - USA_WA_Port.Angeles-William.R.Fairchild.Intl.AP.727885_TMY3.epw
    - USA_IL_Chicago-OHare.Intl.AP.725300_TMYx.2007-2021.epw
    - USA_NY_New.York-J.F.Kennedy.Intl.AP.744860_TMY3.epw
    - USA_PA_Pittsburgh-Allegheny.County.AP.725205_TMY3.epw
  keys:
    - hot
    - mixed
    - cool
    - mixedx
    - nyc
    - pit

# ---------------------------------------------------------------------------- #
#                         BUILDING EXTRA CONFIGURATION                         #
# ---------------------------------------------------------------------------- #
building_config:
  runperiod: [1, 6, 1991, 30, 9, 1991]   # 6/1 ~ 9/30 = 122 days summer (matches other 4 buildings)


# ---------------------------------------------------------------------------- #
#                        WEATHER VARIABILITY (OPTIONAL)                        #
# ---------------------------------------------------------------------------- #
weather_variability:
  Dry Bulb Temperature:
    - 1.0
    - 0.0
    - 24.0
  Relative Humidity:
    - [2.0, 5.0]
    - 0.0
    - 24.0
    - [0, 100]

# ---------------------------------------------------------------------------- #
#                          EPISODES FOLDER GENERATION                          #
# ---------------------------------------------------------------------------- #
max_ep_store: 3

# ---------------------------------------------------------------------------- #
#                             OBSERVATION VARIABLES                            #
# ---------------------------------------------------------------------------- #

# --------------- TIME VARIABLES (same name as EnergyPlus API) --------------- #
time_variables:
  - month
  - day_of_month
  - hour
  - minutes

# ----------------------------- OUTPUT:VARIABLES ----------------------------- #
variables:
  # ---------------------------------- OUTDOOR --------------------------------- #
  Site Outdoor Air DryBulb Temperature:
    variable_names: outdoor_temperature
    keys: Environment
  Site Outdoor Air Relative Humidity:
    variable_names: outdoor_humidity
    keys: Environment

  # -------------------------------- ZONE INDOOR ------------------------------- #
  Zone Air Temperature:
    variable_names: [Z1_temperature, Z2_temperature, Z3_temperature, Z4_temperature, Z5_temperature, Z6_temperature, Z7_temperature, Z8_temperature, Z9_temperature, Z10_temperature, Z11_temperature, Z12_temperature, Z13_temperature, Z14_temperature, Z15_temperature]
    keys: [Core_bottom, Core_mid, Core_top, Perimeter_bot_ZN_1, Perimeter_bot_ZN_2, Perimeter_bot_ZN_3, Perimeter_bot_ZN_4, Perimeter_mid_ZN_1, Perimeter_mid_ZN_2, Perimeter_mid_ZN_3, Perimeter_mid_ZN_4, Perimeter_top_ZN_1, Perimeter_top_ZN_2, Perimeter_top_ZN_3, Perimeter_top_ZN_4]

  # ---------------------------------- SYSTEM ---------------------------------- #
  Zone Thermostat Cooling Setpoint Temperature:
    variable_names: [Z1C_setpoint, Z2C_setpoint, Z3C_setpoint, Z4C_setpoint, Z5C_setpoint, Z6C_setpoint, Z7C_setpoint, Z8C_setpoint, Z9C_setpoint, Z10C_setpoint, Z11C_setpoint, Z12C_setpoint, Z13C_setpoint, Z14C_setpoint, Z15C_setpoint]
    keys: [Core_bottom, Core_mid, Core_top, Perimeter_bot_ZN_1, Perimeter_bot_ZN_2, Perimeter_bot_ZN_3, Perimeter_bot_ZN_4, Perimeter_mid_ZN_1, Perimeter_mid_ZN_2, Perimeter_mid_ZN_3, Perimeter_mid_ZN_4, Perimeter_top_ZN_1, Perimeter_top_ZN_2, Perimeter_top_ZN_3, Perimeter_top_ZN_4]

  # ---------------------------------- OCCUPANCY ------------------------------- #
  # NOTE (2026-06-06): moved up from the end of this block so the post-reduce
  # observation ORDER matches the other 5 buildings (occupancy_fraction before
  # the tank block). Cross-building zero-shot needs an identical 62-dim vector
  # order.
  # All consumers are name-based (LSTM inputs, CSV, comfort/reward); only trained
  # SAC policies depend on the order → MO SAC models retrained after this change.
  Schedule Value:
    variable_names: [occupancy_fraction]
    keys: [BLDG_OCC_SCH]

  # -------- STRATIFIED CHILLED WATER TANK (6 node + use_outlet + final) ------- #
  Chilled Water Thermal Storage Final Tank Temperature:
    variable_names: CWtank_final
    keys: Chilled Water Storage Tank 1
  Chilled Water Thermal Storage Temperature Node 1:
    variable_names: CWtank_node1
    keys: Chilled Water Storage Tank 1
  Chilled Water Thermal Storage Temperature Node 2:
    variable_names: CWtank_node2
    keys: Chilled Water Storage Tank 1
  Chilled Water Thermal Storage Temperature Node 3:
    variable_names: CWtank_node3
    keys: Chilled Water Storage Tank 1
  Chilled Water Thermal Storage Temperature Node 4:
    variable_names: CWtank_node4
    keys: Chilled Water Storage Tank 1
  Chilled Water Thermal Storage Temperature Node 5:
    variable_names: CWtank_node5
    keys: Chilled Water Storage Tank 1
  Chilled Water Thermal Storage Temperature Node 6:
    variable_names: CWtank_node6
    keys: Chilled Water Storage Tank 1
  Chilled Water Thermal Storage Use Side Outlet Temperature:
    variable_names: CWtank_use_outlet
    keys: Chilled Water Storage Tank 1
  Chilled Water Thermal Storage Use Side Inlet Temperature:
    variable_names: CWtank_use_inlet
    keys: Chilled Water Storage Tank 1
  Chilled Water Thermal Storage Source Side Inlet Temperature:
    variable_names: CWtank_source_inlet
    keys: Chilled Water Storage Tank 1
  Chilled Water Thermal Storage Source Side Outlet Temperature:
    variable_names: CWtank_source_outlet
    keys: Chilled Water Storage Tank 1
  Chilled Water Thermal Storage Use Side Heat Transfer Rate:
    variable_names: CoolingRate
    keys: Chilled Water Storage Tank 1

  # ---------------------------------- CHILLER --------------------------------- #
  Chiller Electricity Rate:
    variable_names: ChillerElectricity
    keys: CoolSysPrimary Chiller
  Chiller Evaporator Cooling Rate:
    variable_names: EvapCoolingRate
    keys: CoolSysPrimary Chiller
  Chiller Evaporator Inlet Temperature:
    variable_names: EvapInletT
    keys: CoolSysPrimary Chiller
  Chiller Evaporator Outlet Temperature:
    variable_names: EvapOutletT
    keys: CoolSysPrimary Chiller
  Chiller Part Load Ratio:
    variable_names: ChillerPLR
    keys: CoolSysPrimary Chiller
  Chiller Cycling Ratio:
    variable_names: ChillerCyclingRatio
    keys: CoolSysPrimary Chiller
  Chiller Capacity Temperature Modifier Multiplier:
    variable_names: CapFT
    keys: CoolSysPrimary Chiller
  Chiller EIR Temperature Modifier Multiplier:
    variable_names: EIRfT
    keys: CoolSysPrimary Chiller
  Chiller EIR Part Load Modifier Multiplier:
    variable_names: EIRfPLR
    keys: CoolSysPrimary Chiller
  Chiller Condenser Inlet Temperature:
    variable_names: CondInletT
    keys: CoolSysPrimary Chiller
  Chiller COP:
    variable_names: ChillerCOP
    keys: CoolSysPrimary Chiller


# ------------------------------- OUTPUT:METERS ------------------------------ #
meters: {}

# ---------------------------------------------------------------------------- #
#                               ACTION VARIABLES                               #
# ---------------------------------------------------------------------------- #

# --------------------------- ACTUATORS TO CONTROL --------------------------- #
actuators:
  CW-TANK-TEMP-SCHEDULE:
    variable_name: CWtank_setpoint
    element_type: Schedule:Compact
    value_type: Schedule Value

# ---------------------------------------------------------------------------- #
#                   DYNAMIC CONTEXT CONFIGURABLE IN REAL-TIME                  #
# ---------------------------------------------------------------------------- #
context: {}

# ---------------------------------------------------------------------------- #
#                                 ACTIONS SPACE                                #
# ---------------------------------------------------------------------------- #
# Aligned with other 4 buildings ([5, 12]°C TES setpoint range)
action_space: gym.spaces.Box(low=np.array([5.0], dtype=np.float32), high=np.array([10.0], dtype=np.float32), shape=(1,), dtype=np.float32)

# ---------------------------------------------------------------------------- #
#                                REWARD FUNCTION                               #
# ---------------------------------------------------------------------------- #
# Default reward (used only when case_study does not override via reward_profile).
# range_comfort matches CLGSETP_SCH (weekday 24°C, off 26.7°C) — band [22, 26].
reward: sinergym.utils.rewards:LinearReward

reward_kwargs:
  temperature_variables:
    - Z1_temperature
  energy_variables:
    - ChillerElectricity
  range_comfort_winter:
    - 22.0
    - 26.0
  range_comfort_summer:
    - 22.0
    - 26.0
  summer_start:
    - 6
    - 1
  summer_final:
    - 9
    - 30
  energy_weight: 0.5
  lambda_energy: 1.0e-4
  lambda_temperature: 1.0
